<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>État des lieux – Ticket véhicule</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: "Courier New", monospace;
  background: #eee;
  padding: 20px;
  background-position: center center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  background-size: cover;
   background-image : url("https://images.unsplash.com/photo-1723842161736-647233a1a8a1?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
}

/* LANG SWITCH */
.lang-switch {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 22px;
  cursor: pointer;
  user-select: none;
}

/* HEADER */
.header {
  width: 220px;
  height: 120px;
  background-image: url("https://barthloc.com/images/logo-green.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  margin: 0 auto 20px auto;
}

/* TICKET */
.ticket {
  max-width: 420px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 6px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  position: relative;
}

.ticket::before,
.ticket::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 12px;
  background: radial-gradient(circle, transparent 6px, #fff 6px);
  background-size: 12px 12px;
}

.ticket::before { top: -6px; }
.ticket::after { bottom: -6px; transform: rotate(180deg); }

h1 {
  text-align: center;
  font-size: 18px;
  letter-spacing: 1px;
  margin-bottom: 5px;
}

.sub {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin-bottom: 15px;
}

hr {
  border: none;
  border-top: 1px dashed #ccc;
  margin: 15px 0;
}

.row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.label { font-size: 12px; color:  rgb(229, 227, 223); }
.value { font-size: 14px; font-weight: bold; text-align: right; }

.section-title {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.video {
  width: 100%;
  border-radius: 4px;
  margin-top: 10px;
}

.download {
  display: block;
  margin-top: 10px;
  text-align: center;
  background: #000;
  color: #fff;
  padding: 10px;
  border-radius: 4px;
  font-size: 13px;
  border: none;
  cursor: pointer;
}

.contact {
  font-size: 14px;
  text-align: center;
  margin-top: 15px;
}

.contact a {
  color: #000;
  text-decoration: none;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #777;
  margin-top: 15px;
}
</style>
</head>

<body>

<!-- Language switch -->


<div class="ticket">
  <div class="lang-switch" onclick="toggleLang()">🇫🇷  🇬🇧</div>
  <div class="header"></div>

  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>

  <div id="content">Chargement…</div>

  <div class="contact">
    <p>
      <a href="tel:0590590275281">📞 +590 590 27 52 81</a><br>
      <a href="https://wa.me/590690313640">💬 WhatsApp : +590 690 31 36 40</a><br>
      <a href="mailto:barthloc@wanadoo.fr">✉️ barthloc@wanadoo.fr</a><br>
      <a href="https://barthloc.com" target="_blank">🌐 barthloc.com</a>
    </p>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3796.7379669938045!2d-62.84926299999999!3d17.897702!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8c0e0ab56601cd7b%3A0x43eaeaf2ae792bb7!2sBARTHLOC!5e0!3m2!1sfr!2sfr!4v1768224377264!5m2!1sfr!2sfr" width="90%" height="250" style="border:1px solid #52bf94;border-radius:3px -webkit-border-radius: 15px; -moz-border-radius: 15px;border-radius: 15px;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>

  <div class="footer" id="footer"></div>
</div>

<script>
// ================= CONFIG =================
const AIRTABLE_TOKEN = "patLAKWjyjF1N9EJX.87ddca578bd12fe91c0da12ab0dde58f8f52ce22e250f14bad43f2e67df7fdf2";
const BASE_ID = "appiHWBNHkFAAFIwZ";
const TABLE_NAME = "Mouvement";
const recordId = new URLSearchParams(window.location.search).get("recordId");

// ================= LANG =================
let lang = "fr";
let video = null;
let data = {};

const i18n = {
  fr: {
    title: "ÉTAT DES LIEUX",
    subtitle: "Départ du véhicule",
    vehicle: "Véhicule",
    model: "Modèle",
    plate: "Plaque",
    state: "État",
    fuel: "Niveau d'essence",
    clean: "Propreté",
    video: "Vidéo",
    download: "⬇️ Télécharger la vidéo",
    footer: "Document généré automatiquement – BARTHLOC"
  },
  en: {
    title: "VEHICLE INSPECTION",
    subtitle: "Vehicle departure",
    vehicle: "Vehicle",
    model: "Model",
    plate: "License plate",
    state: "Condition",
    fuel: "Fuel level",
    clean: "Cleanliness",
    video: "Video",
    download: "⬇️ Download video",
    footer: "Automatically generated document – BARTHLOC"
  }
};

function toggleLang() {
  lang = lang === "fr" ? "en" : "fr";
  render();
}

// ================= DOWNLOAD =================
function downloadVideo() {
  if (!video) return alert("No video");

  fetch(video.url)
    .then(r => r.blob())
    .then(b => {
      const a = document.createElement("a");
      const u = URL.createObjectURL(b);
      a.href = u;
      a.download = video.filename || "inspection.mp4";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(u);
    });
}

// ================= LOAD =================
async function load() {
  if (!recordId) return;

  const res = await fetch(
    `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}/${recordId}`,
    { headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` } }
  );

  const record = await res.json();
  data = record.fields;
  video = data["Pièce jointe"]?.[0] || null;
  render();
}

function render() {
  const t = i18n[lang];
  document.getElementById("title").innerText = t.title;
  document.getElementById("subtitle").innerText = t.subtitle;
  document.getElementById("footer").innerText = t.footer;

  document.getElementById("content").innerHTML = `
    <div class="section-title">${t.vehicle}</div>

    <div class="row">
      <div class="label">${t.model}</div>
      <div class="value">${data["modele"]?.[0] || "-"}</div>
    </div>

    <div class="row">
      <div class="label">${t.plate}</div>
      <div class="value">${data["plaque"] || "-"}</div>
    </div>

    <hr>

    <div class="section-title">${t.state}</div>

    <div class="row">
      <div class="label">${t.fuel}</div>
      <div class="value">${data["Niveau essence"] || "-"}/8</div>
    </div>

    <div class="row">
      <div class="label">${t.clean}</div>
      <div class="value">${data["Propreté"] || "-"}</div>
    </div>

    ${
      video ? `
        <hr>
        <div class="section-title">${t.video}</div>
        <video class="video" controls src="${video.url}"></video>
        <button class="download" onclick="downloadVideo()">${t.download}</button>
      ` : ""
    }
  `;
}

load();
</script>

</body>
</html>
