<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>État des lieux – Ticket véhicule</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: "Courier New", monospace;
  background: #eee;
  padding: 20px;
}

.header {
  width: 220px;
  height: 120px;
  background-image: url("https://barthloc.com/images/logo-green.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  margin: 0 auto 20px auto;
}

.ticket {
  max-width: 420px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 6px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  position: relative;
}

.ticket::before,
.ticket::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 12px;
  background: radial-gradient(circle, transparent 6px, #fff 6px);
  background-size: 12px 12px;
}

.ticket::before { top: -6px; }
.ticket::after { bottom: -6px; transform: rotate(180deg); }

h1 {
  text-align: center;
  font-size: 18px;
  letter-spacing: 1px;
  margin-bottom: 5px;
}

.sub {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin-bottom: 15px;
}

hr {
  border: none;
  border-top: 1px dashed #ccc;
  margin: 15px 0;
}

.row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.label { font-size: 12px; color: #555; }
.value { font-size: 14px; font-weight: bold; text-align: right; }

.section-title {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.video {
  width: 100%;
  border-radius: 4px;
  margin-top: 10px;
}

.download {
  display: block;
  margin-top: 10px;
  text-align: center;
  background: #000;
  color: #fff;
  padding: 10px;
  text-decoration: none;
  border-radius: 4px;
  font-size: 13px;
}

.contact {
  font-size: 14px;
  text-align: center;
  margin-top: 15px;
}

.contact a {
  color: #000;
  text-decoration: none;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #777;
  margin-top: 15px;
}
</style>
</head>

<body>



<div class="ticket">
  <div class="header"></div>
  <h1>ÉTAT DES LIEUX</h1>
  <div class="sub">Départ du véhicule</div>

  <div id="content">Chargement…</div>

  <div class="contact">
    <p>
      <a href="tel:0590590275281">📞 +590 590 27 52 81</a><br>
      <a href="https://wa.me/590690313640">💬 WhatsApp : +590 690 31 36 40</a><br>
      <a href="mailto:barthloc@wanadoo.fr">✉️ barthloc@wanadoo.fr</a><br>
      <a href="https://barthloc.com" target="_blank">🌐 barthloc.com</a>
    </p>
  </div>

  <div class="footer">
    Document généré automatiquement – BARTHLOC
  </div>
</div>

<script>
// ⚠️ CLÉ API VISIBLE (lecture seule)
const AIRTABLE_TOKEN = "patLAKWjyjF1N9EJX.87ddca578bd12fe91c0da12ab0dde58f8f52ce22e250f14bad43f2e67df7fdf2";
const BASE_ID = "appiHWBNHkFAAFIwZ";
const TABLE_NAME = "Mouvement";

const recordId = new URLSearchParams(window.location.search).get("recordId");

if (!recordId) {
  document.getElementById("content").innerHTML =
    "<p style='text-align:center;color:red;'>Record ID manquant</p>";
  throw new Error("recordId manquant");
}

async function loadEtatDesLieux() {
  const url = `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}/${recordId}`;

  const res = await fetch(url, {
    headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` }
  });

  if (!res.ok) {
    document.getElementById("content").innerHTML =
      "<p style='text-align:center;color:red;'>Document introuvable</p>";
    return;
  }

  const record = await res.json();
  const f = record.fields;
  const video = f["Pièce jointe"] ? f["Pièce jointe"][0] : null;

  document.getElementById("content").innerHTML = `
    <div class="section-title">Véhicule</div>

    <div class="row">
      <div class="label">Modèle</div>
      <div class="value">${f["modele"] ? f["modele"][0] : "-"}</div>
    </div>

    <div class="row">
      <div class="label">Plaque</div>
      <div class="value">${f["plaque"] || "-"}</div>
    </div>

    <hr>

    <div class="section-title">État</div>

    <div class="row">
      <div class="label">Niveau d'essence</div>
      <div class="value">${f["Niveau essence"] || "-"}/8</div>
    </div>

    <div class="row">
      <div class="label">Propreté</div>
      <div class="value">${f["Propreté"] || "-"}</div>
    </div>

    ${
      video
      ? `
        <hr>
        <div class="section-title">Vidéo</div>
        <video class="video" controls src="${video.url}"></video>
        <a class="download" href="${video.url}" download>
          ⬇️ Télécharger la vidéo
        </a>
      `
      : ""
    }
  `;
}

loadEtatDesLieux();
</script>

</body>
</html>
